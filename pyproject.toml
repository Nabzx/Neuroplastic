[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroplastic"
version = "0.1.0"
description = "Biological neuroplasticity mechanisms against loss of plasticity in continually-learning neural networks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nabil Shah" }]
keywords = [
    "loss-of-plasticity",
    "continual-learning",
    "neuroplasticity",
    "homeostatic-plasticity",
    "structural-plasticity",
    "computational-neuroscience",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0"]

[project.urls]
Repository = "https://github.com/Nabzx/Neuroplastic"

[tool.setuptools]
packages = ["core", "data", "models", "diagnostics", "mechanisms", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
